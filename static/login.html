<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HerRights AI — Login</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .auth-wrap {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            background: var(--panel, #111a2e);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 18px;
            padding: 35px;
            box-sizing: border-box;
        }

        .auth-card h1 {
            margin: 10px 0;
            text-align: center;
        }

        .auth-sub {
            text-align: center;
            color: var(--paper-dim, #aeb5c3);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            color: white;
            font-weight: 600;
        }

        .input-row {
            position: relative;
        }

        .field input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            padding-right: 75px;
            border-radius: 9px;
            border: 1px solid rgba(255,255,255,.15);
            background: #0d1526;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .field input:focus {
            border-color: #e7b24c;
        }

        .toggle-pw {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #e7b24c;
            cursor: pointer;
            font-weight: 600;
        }

        .auth-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #e7b24c;
            color: #111827;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .auth-submit:hover {
            opacity: .9;
        }

        .form-message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .form-message.success {
            display: block;
            background: rgba(70,180,110,.15);
            color: #9be7b5;
        }

        .form-message.error {
            display: block;
            background: rgba(220,70,70,.15);
            color: #ff9b9b;
        }

        .auth-alt {
            text-align: center;
            margin-top: 25px;
            color: #aeb5c3;
        }

        .auth-alt a {
            color: #e7b24c;
            text-decoration: none;
            font-weight: bold;
        }

        .guest-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,.08);
            color: #c7cbd4;
            text-decoration: none;
        }

        .guest-link:hover {
            color: #e7b24c;
        }


        /* =========================================
           PROFILE
        ========================================= */

        .profile-area {
            position: relative;
        }

        .profile-button {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #e7b24c;
            background: #e7b24c;
            color: #111827;
            font-weight: 700;
            font-size: 17px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            line-height: 1;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        .profile-button:hover {
            transform: scale(1.05);
            background: #f0c266;
            border-color: #f0c266;
        }

        .profile-menu {
            position: absolute;
            right: 0;
            top: 52px;
            width: 230px;
            background: #111a2e;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 14px;
            padding: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,.35);
            display: none;
            z-index: 1000;
        }

        .profile-menu.show {
            display: block;
        }

        .profile-name {
            padding: 12px;
            color: white;
            font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,.08);
            margin-bottom: 6px;
        }

        .profile-menu button {
            width: 100%;
            padding: 11px 12px;
            border: none;
            background: transparent;
            color: #d8dce5;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .profile-menu button:hover {
            background: rgba(255,255,255,.07);
            color: #e7b24c;
        }

    </style>

</head>


<body>


<header class="nav">

    <a href="index.html" class="brand">

        <span class="dot pulse"></span>

        HerRights AI

    </a>


    <nav class="links">

        <a href="index.html">

            <span class="dot"></span>

            Home

        </a>


        <a href="resources.html">

            <span class="dot"></span>

            Rights &amp; Resources

        </a>


        <a href="chat.html">

            <span class="dot"></span>

            Chat

        </a>

    </nav>


    <div
        class="nav-right"
        id="navAccount">

        <!-- Account controls inserted here -->

    </div>


</header>



<main class="auth-wrap">

    <div class="auth-card">


        <div class="eyebrow">

            <span class="dot"></span>

            HER RIGHTS AI

        </div>


        <h1>
            Welcome back
        </h1>


        <p class="auth-sub">

            Log in to continue using
            your HerRights AI account.

        </p>


        <form id="loginForm">


            <div class="field">

                <label for="email">
                    Email address
                </label>

                <div class="input-row">

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required>

                </div>

            </div>



            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="input-row">

                    <input
                        type="password"
                        id="password"
                        placeholder="Your password"
                        autocomplete="current-password"
                        required>

                    <button
                        type="button"
                        class="toggle-pw"
                        data-target="password">

                        Show

                    </button>

                </div>

            </div>



            <button
                type="submit"
                class="btn btn-primary auth-submit">

                Log In

            </button>


        </form>


        <div
            id="formMessage"
            class="form-message">

        </div>


        <div class="auth-alt">

            Don't have an account?

            <a href="signup.html">
                Create one
            </a>

        </div>


        <a
            href="index.html"
            class="guest-link">

            Continue without an account →

        </a>


    </div>

</main>



<footer>

    <p>

        HerRights AI — a college prototype for an
        AI-Based Legal Rights &amp; Cyber Safety Assistant.

    </p>

</footer>



<!-- =========================================
     ACCOUNT SYSTEM
========================================= -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    loadAccount
);


async function loadAccount() {

    const navAccount =
        document.getElementById("navAccount");


    try {

        const response =
            await fetch("/api/me");


        const data =
            await response.json();


        if (
            data.logged_in &&
            data.user
        ) {

            const name =
                data.user.name;


            navAccount.innerHTML = `

                <div class="profile-area">

                    <button
                        class="profile-button"
                        id="profileButton">

                        ${getInitial(name)}

                    </button>


                    <div
                        class="profile-menu"
                        id="profileMenu">


                        <div class="profile-name">

                            ${escapeHtml(name)}

                        </div>


                        <button
                            id="changeAccount">

                            Change account

                        </button>


                        <button
                            id="guestMode">

                            Use without an account

                        </button>


                        <button
                            id="logoutButton">

                            Sign out

                        </button>


                    </div>

                </div>

            `;


            setupProfileMenu();

        }

        else {

            navAccount.innerHTML = `

                <a
                    href="login.html"
                    class="nav-auth">

                    Log in

                </a>


                <a
                    href="signup.html"
                    class="nav-auth">

                    Sign up

                </a>

            `;

        }

    }

    catch (error) {

        console.error(error);


        navAccount.innerHTML = `

            <a
                href="login.html"
                class="nav-auth">

                Log in

            </a>


            <a
                href="signup.html"
                class="nav-auth">

                Sign up

            </a>

        `;

    }

}



function setupProfileMenu() {

    const profileButton =
        document.getElementById(
            "profileButton"
        );


    const profileMenu =
        document.getElementById(
            "profileMenu"
        );


    profileButton.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            profileMenu.classList.toggle(
                "show"
            );

        }
    );


    document.addEventListener(
        "click",
        function() {

            profileMenu.classList.remove(
                "show"
            );

        }
    );


    document
        .getElementById("changeAccount")
        .addEventListener(
            "click",
            function() {

                window.location.href =
                    "login.html";

            }
        );


    document
        .getElementById("guestMode")
        .addEventListener(
            "click",
            async function() {

                await fetch(
                    "/api/logout",
                    {
                        method: "POST"
                    }
                );


                window.location.href =
                    "index.html";

            }
        );


    document
        .getElementById("logoutButton")
        .addEventListener(
            "click",
            async function() {

                await fetch(
                    "/api/logout",
                    {
                        method: "POST"
                    }
                );


                window.location.href =
                    "index.html";

            }
        );

}



function getInitial(name) {

    if (!name) {

        return "U";

    }


    return name
        .trim()
        .charAt(0)
        .toUpperCase();

}



function escapeHtml(text) {

    const div =
        document.createElement("div");


    div.textContent = text;


    return div.innerHTML;

}


// =========================================
// LOGIN
// =========================================

const loginForm =
    document.getElementById("loginForm");

const formMessage =
    document.getElementById("formMessage");


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        try {

            const response =
                await fetch(
                    "/api/login",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            email: email,

                            password: password

                        })

                    }
                );


            const data =
                await response.json();


            if (data.success) {

                showMessage(
                    "Login successful! Welcome, "
                    + data.user.name
                    + "!",
                    "success"
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "index.html";

                    },
                    800
                );

            }

            else {

                showMessage(
                    data.message,
                    "error"
                );

            }

        }

        catch (error) {

            console.error(error);

            showMessage(
                "Cannot connect to the HerRights AI server. Make sure python app.py is running.",
                "error"
            );

        }

    }
);


function showMessage(text, type) {

    formMessage.textContent = text;

    formMessage.className =
        "form-message " + type;

}

</script>


</body>

</html>
